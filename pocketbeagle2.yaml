{{- $suite := or .suite "trixie" -}}
{{- $image := or .image "pocketbeagle2.img" -}}
{{- $compress := or .compress false -}}

{{- $architecture := "arm64" -}}

architecture: {{ $architecture }}

actions:
  - action: mmdebstrap
    suite: {{ $suite }}
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware

  - action: apt
    description: "Install basic dependencies"
    update: true
    packages:
      - bash-completion
      - bc
      - build-essential
      - ca-certificates
      - curl
      - device-tree-compiler
      - git
      - gpiod
      - htop
      - i2c-tools
      - iwd
      - nano
      - python-is-python3
      - sudo
      - vim
      - wget
      - ssl-cert

  - action: download
    name: bb-keyring
    url: https://debian.beagle.cc/arm64/pool/main/b/bbb.io-keyring/bbb.io-keyring_1.20250813.0-0~trixie%2B20250813_all.deb

  - action: overlay
    origin: bb-keyring
    destination: /bb-keyring.deb

  - action: run
    description: "Add beagle mirrors"
    chroot: true
    script: scripts/setup_beagleboard_debian_mirrors.sh {{ $architecture }} {{ $suite }}

  - action: apt
    description: "Update beagleboard keyring"
    update: true
    unauthenticated: true
    packages:
      - bbb.io-keyring
      - bbb.io-kernel-6.12-ti-k3-am62
      - bb-u-boot-pocketbeagle2

  # Personally, I feel like it would be nice to make bb-u-boot-pocketbeagle2 install stuff in firmware directly
  - action: run
    description: "Setup uboot"
    script: scripts/setup_uboot.sh bb-u-boot-pocketbeagle2

  # Again, would be nice if the kernel package did this itself
  - action: run
    description: "Setup Kernel"
    script: scripts/setup_linux.sh

  - action: image-partition
    imagename: {{ $image }}
    imagesize: 2GiB
    partitiontype: msdos
    mountpoints:
      - partition: BOOT
        mountpoint: /boot/firmware
      - mountpoint: /
        partition: root
    partitions:
      - name: BOOT
        fs: fat32
        start: 0%
        end: 128MiB
        flags:
          - boot
      - name: root
        fs: ext4
        start: 128MiB
        end: 100%

  - action: filesystem-deploy
    setup-fstab: false
    setup-kernel-cmdline: false

  - action: run
    description: "Create block map file"
    postprocess: true
    command: bmaptool create {{ $image }} > {{ $image }}.bmap

    {{ if $compress }}
  - action: run
    description: "Compressing final image"
    postprocess: true
    command: xz -f {{ $image }}
    {{ end }}
